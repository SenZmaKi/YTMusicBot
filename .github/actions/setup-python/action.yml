name: Set up Python with uv
description: Set up Python, uv, and install locked dependencies
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true

    - name: Sync dependencies
      shell: bash
      run: uv sync --dev --frozen
